name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, mbstring, intl
          coverage: none

      - name: Lint
        run: |
          find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Tests
        run: |
          set -e
          for t in tests/run-*.php; do
            echo "== $t"
            php "$t"
          done
